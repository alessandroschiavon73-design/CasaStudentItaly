name: Supabase connection check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-check.yml'
      - 'assets/js/config.js'
      - 'assets/js/supabase-integration.js'
      - 'database/**'

permissions:
  contents: write

jobs:
  check-supabase:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read frontend Supabase URL
        id: config
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path('assets/js/config.js').read_text(encoding='utf-8')
          url = re.search(r'supabaseUrl:\s*"([^"]+)"', text)
          if not url:
              raise SystemExit('Supabase URL missing from assets/js/config.js')
          print(f'url={url.group(1)}')
          PY

      - name: Apply required database grants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql=Path('database/supabase-public-access-grants-v1.sql').read_text(encoding='utf-8')
          Path('/tmp/db-query.json').write_text(json.dumps({'query':sql,'read_only':False}))
          PY
          status=$(curl --silent --show-error --output /tmp/db-query-response.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/db-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          if [[ "$status" != 2* ]]; then
            echo "Applying database grants failed with HTTP $status"
            python - <<'PY'
          import re
          from pathlib import Path
          body=Path('/tmp/db-query-response.json').read_text(errors='replace') if Path('/tmp/db-query-response.json').exists() else ''
          body=re.sub(r'sb_[A-Za-z0-9_-]+','[redacted-key]',body)
          body=re.sub(r'eyJ[A-Za-z0-9._-]+','[redacted-jwt]',body)
          print(body[:1000])
          PY
            exit 1
          fi
          echo "Required database grants applied/confirmed."
          rm -f /tmp/db-query.json /tmp/db-query-response.json

      - name: Resolve a working public API key securely
        env:
          SUPABASE_URL: ${{ steps.config.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF GitHub secret is missing."
            exit 1
          fi

          EXPECTED_REF=$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('assets/js/config.js').read_text(encoding='utf-8')
          url=re.search(r'supabaseUrl:\s*"https://([a-z0-9]+)\.supabase\.co"', text)
          print(url.group(1) if url else '')
          PY
          )
          if [ "$EXPECTED_REF" != "$SUPABASE_PROJECT_REF" ]; then
            echo "Configured Supabase URL and SUPABASE_PROJECT_REF do not point to the same project."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -o /tmp/supabase-api-keys.json

          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/supabase-api-keys.json').read_text())
          candidates=[]
          for row in rows:
              key=row.get('api_key') or row.get('key') or ''
              typ=(row.get('type') or '').lower()
              name=(row.get('name') or row.get('id') or '').lower()
              if key.startswith('sb_publishable_'):
                  candidates.append(('publishable',key))
              elif key and (name=='anon' or typ=='anon'):
                  candidates.append(('anon',key))
          if not candidates:
              raise SystemExit('No publishable or legacy anon key returned by Supabase')
          Path('/tmp/public-candidates.json').write_text(json.dumps(candidates))
          PY

          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          url=os.environ['SUPABASE_URL'].rstrip('/')
          candidates=json.loads(Path('/tmp/public-candidates.json').read_text())
          working=None
          for kind,key in candidates:
              cmd=['curl','--silent','--show-error','--output','/tmp/candidate-response.json','--write-out','%{http_code}',
                   '-H',f'apikey: {key}','-H','Accept: application/json']
              if kind=='anon':
                  cmd += ['-H',f'Authorization: Bearer {key}']
              cmd += [f'{url}/rest/v1/cities?select=id&country_code=eq.IT&active=eq.true&limit=1']
              result=subprocess.run(cmd,capture_output=True,text=True,check=False)
              status=result.stdout.strip()
              if status.startswith('2'):
                  working=(kind,key)
                  break
          if not working:
              body=Path('/tmp/candidate-response.json').read_text(errors='replace') if Path('/tmp/candidate-response.json').exists() else ''
              body=re.sub(r'sb_[A-Za-z0-9_-]+','[redacted-key]',body)
              body=re.sub(r'eyJ[A-Za-z0-9._-]+','[redacted-jwt]',body)
              raise SystemExit(f'No public key can read cities. Last response: {body[:400]}')
          kind,key=working
          Path('/tmp/public-key.txt').write_text(key)
          Path('/tmp/public-key-kind.txt').write_text(kind)
          PY

          SUPABASE_PUBLIC_KEY=$(cat /tmp/public-key.txt)
          SUPABASE_PUBLIC_KEY_KIND=$(cat /tmp/public-key-kind.txt)
          echo "::add-mask::$SUPABASE_PUBLIC_KEY"
          echo "SUPABASE_PUBLIC_KEY=$SUPABASE_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLIC_KEY_KIND=$SUPABASE_PUBLIC_KEY_KIND" >> "$GITHUB_ENV"
          echo "Working public credential type: $SUPABASE_PUBLIC_KEY_KIND"
          rm -f /tmp/public-key.txt /tmp/public-key-kind.txt /tmp/public-candidates.json /tmp/candidate-response.json /tmp/supabase-api-keys.json

      - name: Synchronize frontend public key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          from pathlib import Path
          path=Path('assets/js/config.js')
          text=path.read_text(encoding='utf-8')
          key=os.environ['SUPABASE_PUBLIC_KEY']
          updated,n=re.subn(r'(supabasePublishableKey:\s*")[^"]+("[,])', r'\1'+key+r'\2', text, count=1)
          if n != 1:
              raise SystemExit('Could not update supabasePublishableKey in assets/js/config.js')
          path.write_text(updated, encoding='utf-8')
          PY

          if ! git diff --quiet -- assets/js/config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/config.js
            git commit -m "Sync working Supabase public API key"
            git push origin HEAD:main
          fi

      - name: Check public database contract
        env:
          SUPABASE_URL: ${{ steps.config.outputs.url }}
          SUPABASE_KEY: ${{ env.SUPABASE_PUBLIC_KEY }}
          SUPABASE_KEY_KIND: ${{ env.SUPABASE_PUBLIC_KEY_KIND }}
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local resource="$1"
            local query="$2"
            echo "Checking $resource"
            args=(--fail-with-body --silent --show-error -H "apikey: $SUPABASE_KEY" -H "Accept: application/json")
            if [ "$SUPABASE_KEY_KIND" = "anon" ]; then
              args+=(-H "Authorization: Bearer $SUPABASE_KEY")
            fi
            response=$(curl "${args[@]}" "$SUPABASE_URL/rest/v1/$resource?$query")
            python - "$resource" "$response" <<'PY'
          import json, sys
          resource, payload = sys.argv[1], sys.argv[2]
          value = json.loads(payload)
          if not isinstance(value, list):
              raise SystemExit(f'{resource}: unexpected REST payload')
          print(f'{resource}: OK ({len(value)} row(s) returned in smoke test)')
          PY
          }

          check_endpoint "cities" "select=id,slug,name,country_code&country_code=eq.IT&active=eq.true&limit=1"
          check_endpoint "public_listings" "select=id,country_code,city_id,status&country_code=eq.IT&status=eq.published&limit=1"
          check_endpoint "public_student_requests" "select=id,country_code,city_id,status&country_code=eq.IT&status=eq.published&limit=1"

      - name: Verify frontend integration contract
        shell: bash
        run: |
          grep -q 'apiMode: "supabase"' assets/js/config.js
          grep -q 'listingSource = session?.user ? "listings" : "public_listings"' assets/js/supabase-integration.js
          grep -q 'public_student_requests' assets/js/supabase-integration.js
          echo "CasaStudent frontend Supabase contract: OK"
