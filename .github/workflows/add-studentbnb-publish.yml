name: Add StudentBnB publish option

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/add-studentbnb-publish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch publish form
        run: |
          echo '' | base64 -d > /tmp/patch_studentbnb.py
          python /tmp/patch_studentbnb.py
      - name: Commit changes
        run: |
          git config user.name 'CasaStudent Bot'
          git config user.email 'actions@github.com'
          git add pubblica.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add StudentBnB test-stay cross-publish pricing'
            git push
          fi
