<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Reindirizzamento | CasaStudent</title>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var city=(params.get('city')||'padova').toLowerCase().trim();
  city=city.replace(/[^a-z0-9-]/g,'')||'padova';
  params.delete('city');
  var qs=params.toString();
  location.replace('/'+city+'/'+(qs?'?'+qs:''));
})();
</script>
</head>
<body>
<p>Reindirizzamento alla pagina della città…</p>
<noscript><p><a href="/padova/">Apri CasaStudent Padova</a></p></noscript>
</body>
</html>
