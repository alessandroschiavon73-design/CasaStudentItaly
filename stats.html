<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Statistiche CasaStudent</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body{background:#f5f7fb}.stats-shell{max-width:1100px;margin:0 auto;padding:32px 18px 64px}.stats-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat-card,.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.stat-card span{display:block;color:#64748b;font-size:13px}.stat-card strong{display:block;font-size:32px;margin-top:4px}.panel{margin-top:18px}.panel h2{margin-top:0}.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) 4fr auto;gap:12px;align-items:center;margin:10px 0}.bar-track{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:#1f6feb;border-radius:999px}.muted{color:#64748b}.hidden{display:none!important}.login-box{max-width:520px;margin:70px auto;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px}.login-box input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:10px 0 14px}.login-box button,.stats-head button{padding:10px 14px;border:0;border-radius:10px;background:#111827;color:white;font-weight:700;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef2f7;font-size:14px}@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-row{grid-template-columns:1fr auto}.bar-track{grid-column:1/-1}}
  </style>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="stats-shell">
    <section id="auth-panel" class="login-box hidden">
      <h1>Statistiche CasaStudent</h1>
      <p class="muted">Questa pagina è riservata all'amministratore.</p>
      <form id="stats-login-form">
        <label for="stats-email">Email</label>
        <input id="stats-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Invia link di accesso</button>
      </form>
      <p id="auth-message" class="muted"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="stats-head">
        <div><h1>Statistiche CasaStudent</h1><p id="range-label" class="muted">Ultimi 30 giorni</p></div>
        <div><button id="refresh-stats" type="button">Aggiorna</button> <button id="logout-stats" type="button">Esci</button></div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><span>Visite oggi</span><strong id="today-views">0</strong></div>
        <div class="stat-card"><span>Visite 30 giorni</span><strong id="month-views">0</strong></div>
        <div class="stat-card"><span>Visitatori unici</span><strong id="unique-visitors">0</strong></div>
        <div class="stat-card"><span>Sessioni</span><strong id="sessions">0</strong></div>
      </div>
      <section class="panel"><h2>Pagine più viste</h2><div id="top-pages"></div></section>
      <section class="panel"><h2>Interazioni</h2><div class="stats-grid">
        <div class="stat-card"><span>Click CTA</span><strong id="cta-clicks">0</strong></div>
        <div class="stat-card"><span>Click interni</span><strong id="internal-clicks">0</strong></div>
        <div class="stat-card"><span>Click esterni</span><strong id="outbound-clicks">0</strong></div>
        <div class="stat-card"><span>Referrer diversi</span><strong id="referrers">0</strong></div>
      </div></section>
      <section class="panel"><h2>Ultime visite</h2><div class="table-wrap"><table><thead><tr><th>Ora</th><th>Pagina</th><th>Referrer</th></tr></thead><tbody id="recent-visits"></tbody></table></div></section>
    </section>
  </main>
  <script src="assets/js/stats.js"></script>
</body>
</html>
